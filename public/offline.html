<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline — Lastrivon Kart India</title>
  <meta name="theme-color" content="#ea580c" />
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #fafaf9; color: #1c1917; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      background: #fff; border: 1px solid #e7e5e4; border-radius: 20px;
      padding: 40px 28px; box-shadow: 0 8px 30px rgba(28,25,23,.06);
    }
    .badge {
      width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      background: #ffedd5; font-size: 34px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #78716c; line-height: 1.6; margin-bottom: 22px; }
    button {
      appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
      background: #ea580c; color: #fff; padding: 12px 28px; border-radius: 9999px;
      box-shadow: 0 6px 16px rgba(234,88,12,.35);
    }
    button:active { transform: translateY(1px); }
    .brand { margin-top: 26px; font-size: 12px; color: #a8a29e; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="badge" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>
      Looks like your internet connection dropped.<br />
      Check your data or Wi-Fi and try again —<br />
      your cart is safe and will be right here.
    </p>
    <button onclick="location.reload()">Try again</button>
    <div class="brand">🛍️ Lastrivon Kart India</div>
  </main>
</body>
</html>
